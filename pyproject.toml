[build-system]
requires = [
  "setuptools>=80",
  "setuptools-scm[simple]>=9.2",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "inflectg2p"
dynamic = ["version"]
description = "Independent Inflect v2 English normalization, phonemization, and token-ID frontend"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "inflectg2p contributors"}]
keywords = ["tts", "inflect", "g2p", "phonemizer", "espeak", "onnx"]
dependencies = [
  "phonemizer>=3.3,<4",
  "espeakng-loader>=0.2.4,<0.3",
  "num2words>=0.5.14,<0.6",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.16,<0.17",
  "mypy>=1.11",
  "build>=1",
  "twine>=5",
  "packaging>=24",
]

[project.urls]
Repository = "https://github.com/buchwandler/inflectg2p"
Homepage = "https://github.com/buchwandler/inflectg2p"

[project.scripts]
inflectg2p = "inflectg2p.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["inflectg2p*"]

[tool.setuptools.package-data]
inflectg2p = ["py.typed"]

[tool.setuptools_scm]
fallback_version = "0.1.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
packages = ["inflectg2p"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

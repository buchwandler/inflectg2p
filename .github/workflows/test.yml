name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install eSpeak NG
        run: |
          sudo apt-get update
          sudo apt-get install --yes espeak-ng
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest
      - name: Check formatting and lint
        run: python -m ruff check inflectg2p tests examples docs/make.py tools
      - name: Check types
        run: python -m mypy inflectg2p
      - name: Compile sources and examples
        run: python -m compileall -q inflectg2p tests tools examples

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install documentation dependencies
        run: python -m pip install -e '.[docs]'
      - name: Build documentation
        run: python docs/make.py html

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install packaging tools
        run: python -m pip install -e '.[dev]'
      - name: Build sdist and wheel
        run: |
          rm -rf dist build
          python -m build --sdist --wheel
      - name: Validate artifacts
        run: |
          python -m twine check dist/*
          python tools/check_release_artifacts.py dist
